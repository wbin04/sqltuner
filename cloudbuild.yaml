steps:
  # Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sqltuner-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sqltuner-backend:latest'
      - '-f'
      - 'backend/Dockerfile.prod'
      - './backend'
    id: 'build-backend'

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_BACKEND_URL}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sqltuner-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sqltuner-frontend:latest'
      - '-f'
      - 'frontend/Dockerfile.prod'
      - './frontend'
    id: 'build-frontend'

  # Deploy Backend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sqltuner-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sqltuner-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
    id: 'deploy-backend'
    waitFor: ['build-backend']

  # Deploy Frontend
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sqltuner-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sqltuner-frontend:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
    id: 'deploy-frontend'
    waitFor: ['build-frontend']

images:
  - 'gcr.io/$PROJECT_ID/sqltuner-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sqltuner-backend:latest'
  - 'gcr.io/$PROJECT_ID/sqltuner-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sqltuner-frontend:latest'

substitutions:
  _BACKEND_URL: 'https://sqltuner-backend-xxxxx.run.app'

options:
  machineType: 'N1_HIGHCPU_8'
